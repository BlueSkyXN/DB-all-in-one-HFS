standard = "2.1"
project = "db-all-in-one-hfs"
space = "BlueSkyXN/db-all-in-one-hfs"
sovereignty = "port"
lane = "artifact"
version_source = "tag"
project_class = "preview"
target_role = "primary"
env_file = ".env"
secret_files = []

# These keys are local deployment controls only. They must never be copied to
# Space Settings, artifact manifests, archives, or generated runtime files.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# Values must exist first in the ignored local plaintext ledger; Space Settings
# are deployment copies, while this registry records names and relationships only.
secrets = [
  "NOCODB_ARTIFACT_DOWNLOAD_TOKEN",
  "MYSQL_ROOT_PASSWORD",
  "MYSQL_PASSWORD",
  "NC_AUTH_JWT_SECRET",
  "OPS_TOKEN",
]
variables = [
  "NC_SITE_URL",
  "NC_DEFAULT_LOCALE",
  "NOCODB_ARTIFACT_MANIFEST_URL",
  "NOCODB_ARTIFACT_SLOT",
]

dist_bucket = "hfs-dist"

# Product pins, archive schema, layout assertions, bootstrap behavior, and
# persistence invariants live in Dockerfile, docker/nocodb_bootstrap.py,
# scripts/check-hfs-artifact-contract.sh, and their documented contracts.
