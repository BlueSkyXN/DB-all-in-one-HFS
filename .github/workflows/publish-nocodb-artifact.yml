name: publish-nocodb-artifact

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact slot to update"
        required: true
        type: choice
        options: [edge, release]
      release_tag:
        description: "Existing immutable GitHub Release tag; required for release"
        required: false
        type: string
      confirmation:
        description: "Type PUBLISH_NOCODB_ARTIFACT to authorize remote writes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: inputs.confirmation == 'PUBLISH_NOCODB_ARTIFACT'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HFS_BUCKET_NAMESPACE: ${{ vars.HFS_BUCKET_NAMESPACE }}
      # HTTPS base of hfs-dist; no credentials or query parameters are allowed.
      HFS_DIST_BASE_URL: ${{ vars.HFS_DIST_BASE_URL }}
    steps:
      - name: Checkout immutable wrapper source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Hugging Face CLI
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub==1.5.0" "click==8.3.3"
          python -m huggingface_hub.cli.hf version
          python -m huggingface_hub.cli.hf --help >/dev/null
          python -m huggingface_hub.cli.hf buckets --help >/dev/null

      - name: Validate publication inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo 'GitHub CLI is required on the runner.' >&2; exit 1; }
          test -n "${HF_TOKEN}" || { echo 'HF_TOKEN Secret is required.' >&2; exit 1; }
          test -n "${HFS_BUCKET_NAMESPACE}" || { echo 'HFS_BUCKET_NAMESPACE Variable is required.' >&2; exit 1; }
          [[ "${HFS_BUCKET_NAMESPACE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo 'HFS_BUCKET_NAMESPACE must be a credential-free namespace slug.' >&2; exit 1; }
          test -n "${HFS_DIST_BASE_URL}" || { echo 'HFS_DIST_BASE_URL Variable is required.' >&2; exit 1; }
          HFS_DIST_BASE_URL="${HFS_DIST_BASE_URL}" python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["HFS_DIST_BASE_URL"])
          if (
              parsed.scheme != "https"
              or not parsed.netloc
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("HFS_DIST_BASE_URL must be a credential-free HTTPS URL without query or fragment.")
          PY
          if [ "${{ inputs.target }}" = release ]; then
            test -n "${RELEASE_TAG}" || { echo 'release_tag is required for release.' >&2; exit 1; }
          fi

      - name: Build and verify a rootfs archive
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          source_ref=$(grep -E '^ARG NOCODB_SOURCE_REF=' Dockerfile | cut -d= -f2-)
          test -n "${source_ref}"
          case "${source_ref}" in *:*@sha256:*) ;; *) echo 'NOCODB_SOURCE_REF must contain tag and digest.' >&2; exit 1 ;; esac
          wrapper_source_ref=$(git rev-parse HEAD)
          ref_name=${source_ref#*/}
          ref_name=${ref_name%%@*}
          ref_name=${ref_name#*:}
          artifact_name="nocodb-runtime-${ref_name}-${wrapper_source_ref}.tar.gz"
          workdir=$(mktemp -d)
          trap 'rm -rf "${workdir}"' EXIT
          docker pull "${source_ref}"
          container_id=$(docker create "${source_ref}")
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true; rm -rf "${workdir}"' EXIT
          mkdir -p "${workdir}/rootfs"
          docker export "${container_id}" | tar -C "${workdir}/rootfs" -xf -
          docker rm -f "${container_id}" >/dev/null
          tar -C "${workdir}" -czf "${artifact_name}" rootfs
          sha256=$(sha256sum "${artifact_name}" | cut -d' ' -f1)
          size_bytes=$(stat --format=%s "${artifact_name}")
          mkdir -p dist
          mv "${artifact_name}" dist/
          {
            printf 'source_ref=%s\n' "${source_ref}"
            printf 'wrapper_source_ref=%s\n' "${wrapper_source_ref}"
            printf 'artifact_name=%s\n' "${artifact_name}"
            printf 'sha256=%s\n' "${sha256}"
            printf 'size_bytes=%s\n' "${size_bytes}"
          } >> "$GITHUB_OUTPUT"

      - name: Archive tag artifact in GitHub Release
        if: inputs.target == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" >/dev/null
          # A tag archive is historical rollback evidence: never overwrite an
          # existing asset, even when the file name happens to match.
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' \
              | grep -Fx "${{ steps.artifact.outputs.artifact_name }}"; then
            echo 'refusing to overwrite an immutable GitHub Release asset.' >&2
            exit 1
          fi
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          release_tag_ref="refs/hfs-release-validation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:${release_tag_ref}"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]
          [[ "$(git cat-file -t "$release_tag_ref")" == "tag" ]]
          [[ "$(git rev-parse "${release_tag_ref}^{commit}")" == "$GITHUB_SHA" ]]
          git update-ref -d "$release_tag_ref"
          gh release upload "${RELEASE_TAG}" "dist/${{ steps.artifact.outputs.artifact_name }}"
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' \
            | grep -Fx "${{ steps.artifact.outputs.artifact_name }}"
          mkdir -p release-readback
          gh release download "${RELEASE_TAG}" \
            --pattern "${{ steps.artifact.outputs.artifact_name }}" \
            --dir release-readback
          printf '%s  %s\n' "${{ steps.artifact.outputs.sha256 }}" \
            "release-readback/${{ steps.artifact.outputs.artifact_name }}" | sha256sum -c -

      - name: Upload artifact, read it back, then publish manifest last
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"
          prefix="hf://buckets/${HFS_BUCKET_NAMESPACE}/hfs-dist/db-all-in-one-hfs/${target}"
          artifact_name="${{ steps.artifact.outputs.artifact_name }}"
          artifact_uri="${prefix}/${artifact_name}"
          manifest_uri="${prefix}/manifest.json"
          artifact_url="${HFS_DIST_BASE_URL%/}/db-all-in-one-hfs/${target}/${artifact_name}"
          manifest_url="${HFS_DIST_BASE_URL%/}/db-all-in-one-hfs/${target}/manifest.json"
          case "${artifact_url}" in https://*) ;; *) exit 1 ;; esac
          mkdir -p readback
          python -m huggingface_hub.cli.hf buckets cp \
            "dist/${artifact_name}" "${artifact_uri}"
          python -m huggingface_hub.cli.hf buckets cp \
            "${artifact_uri}" "readback/${artifact_name}"
          printf '%s  %s\n' "${{ steps.artifact.outputs.sha256 }}" "readback/${artifact_name}" | sha256sum -c -
          SOURCE_REF="${{ steps.artifact.outputs.source_ref }}" \
          WRAPPER_SOURCE_REF="${{ steps.artifact.outputs.wrapper_source_ref }}" \
          ARTIFACT_NAME="${artifact_name}" ARTIFACT_URL="${artifact_url}" \
          ARTIFACT_SHA256="${{ steps.artifact.outputs.sha256 }}" \
          ARTIFACT_SIZE="${{ steps.artifact.outputs.size_bytes }}" TARGET="${target}" \
          python3 - <<'PY' > manifest.json
          import json, os
          from datetime import datetime, timezone
          print(json.dumps({
              "schema_version": 1,
              "project": "db-all-in-one-hfs",
              "slot": os.environ["TARGET"],
              "source_kind": "oci-image",
              "source_ref": os.environ["SOURCE_REF"],
              "wrapper_source_ref": os.environ["WRAPPER_SOURCE_REF"],
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "artifact": {
                  "name": os.environ["ARTIFACT_NAME"],
                  "url": os.environ["ARTIFACT_URL"],
                  "sha256": os.environ["ARTIFACT_SHA256"],
                  "size_bytes": int(os.environ["ARTIFACT_SIZE"]),
              },
          }, sort_keys=True, separators=(",", ":")))
          PY
          python -m huggingface_hub.cli.hf buckets cp manifest.json "${manifest_uri}"
          python -m huggingface_hub.cli.hf buckets cp \
            "${manifest_uri}" readback/manifest.json
          cmp manifest.json readback/manifest.json
          printf 'Published and read back manifest: %s\n' "${manifest_url}"
